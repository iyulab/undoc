[package]
name = "undoc-cli"
version = "0.10.0"
edition = "2021"
authors = ["iyulab"]
description = "CLI for undoc - Microsoft Office document extraction"
license = "MIT"
repository = "https://github.com/iyulab/undoc"
rust-version = "1.88"

[[bin]]
name = "undoc"
path = "src/main.rs"

[dependencies]
undoc = { version = "0.10.0", path = ".." }
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
indicatif = "0.18"
serde_json = "1.0"
self_update = { version = "1.3", features = ["archive-zip", "archive-tar", "compression-tar-gz", "compression-zip-deflate"] }

# Staging directory and in-place binary replacement for the update flow. self_update stopped
# re-exporting these in 1.0; its own docs direct callers to depend on them directly.
tempfile = "3"
self-replace = "1.5"
semver = "1.0"
