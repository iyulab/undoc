[package]
name = "undoc-cli"
version = "0.27.1"
edition = "2021"
authors = ["iyulab"]
description = "CLI for undoc - Microsoft Office document extraction"
license = "MIT"
repository = "https://github.com/iyulab/undoc"
rust-version = "1.88"

[[bin]]
name = "undoc"
path = "src/main.rs"

[dependencies]
undoc = { version = "0.27.1", path = ".." }
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
indicatif = "0.18"
serde_json = "1.0"

# The update notice and the `update` command, shared by the family's CLIs.
unparser-shared = { version = "0.12", default-features = false, features = ["cli-update"] }

[dev-dependencies]
# Scratch directories for the CLI integration tests.
tempfile = "3"
# Building an in-memory DOCX for the CLI integration tests, so they carry their own
# fixture instead of skipping when one is absent.
zip = { version = "9.0", default-features = false }
