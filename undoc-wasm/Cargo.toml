[package]
name = "undoc-wasm"
version = "0.24.0"
edition = "2021"
description = "High-performance Microsoft Office (DOCX, XLSX, PPTX, DOC, XLS, PPT) extraction to Markdown (WebAssembly)"
repository = "https://github.com/iyulab/undoc"
license = "MIT"
keywords = ["docx", "xlsx", "pptx", "wasm", "webassembly"]
categories = ["wasm", "parser-implementations"]

[lib]
crate-type = ["cdylib"]

# Every format is on by default; build with `--no-default-features --features docx,...` for a
# smaller binary. `doc` is the one that pulls in a decompressor (flate2/zlib-rs).
[features]
default = ["docx", "xlsx", "pptx", "doc", "xls", "ppt"]
docx = ["undoc/docx"]
xlsx = ["undoc/xlsx"]
pptx = ["undoc/pptx"]
doc = ["undoc/doc"]
xls = ["undoc/xls"]
ppt = ["undoc/ppt"]

[dependencies]
# Excludes "refine": pulls in a fresh pulldown-cmark/pulldown-cmark-to-cmark
# that undoc otherwise has no use for, measured +21.5% wasm bundle size.
# Revisit once the wasm bindings pass RenderOptions through at all (they
# currently hardcode RenderOptions::default() for every option, not just
# this one).
undoc = { path = "..", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
zip = { version = "9.0", default-features = false }
