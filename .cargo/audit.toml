# cargo-audit configuration.
#
# Advisories listed here are known, reviewed, and accepted. Everything else
# fails `cargo audit` (see the Security Audit job in .github/workflows/ci.yml).
#
# The list is deliberately empty. It previously carried RUSTSEC-2026-0194 and
# RUSTSEC-2026-0195 (quick-xml 0.23 denial of service), reachable only through
# self_update's S3 release backend. cargo-audit ignores are global per advisory
# ID, so those entries also masked the same advisories on the library's own
# direct quick-xml dependency -- the parser that reads untrusted documents.
# self_update 1.x made the S3 backend optional and off by default, so quick-xml
# 0.23 is no longer in the dependency graph at all and the exemption is gone
# along with the reason for it.

[advisories]
ignore = []
