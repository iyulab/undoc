name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use Cargo.toml version)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # Run JavaScript actions on Node.js 24. Opt-in flag documented in
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  # Forced default on 2026-06-02; remove this line after that date.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_num: ${{ steps.get_version.outputs.version_num }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION_NUM="${{ inputs.version }}"
          else
            VERSION_NUM=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=v${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "Version: v${VERSION_NUM}"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release $VERSION does not exist, proceeding"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-release:
    name: Build Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: undoc
            archive_name: undoc-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: undoc.exe
            archive_name: undoc-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: undoc
            archive_name: undoc-macos-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: undoc
            archive_name: undoc-macos-aarch64
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p undoc-cli

      - name: Create archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.archive_name }}-${{ needs.check-version.outputs.version }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath "${{ matrix.archive_name }}-${{ needs.check-version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.archive_name }}-${{ needs.check-version.outputs.version }}.${{ matrix.archive_ext }}
          retention-days: 1

  binding-tests:
    # Pre-release gate. The bindings are otherwise built, tested and published
    # by bindings.yml, which only starts once this workflow has already created
    # the GitHub Release and pushed to crates.io — far too late to stop a bad
    # release. Running the same reusable workflow here with publish disabled
    # puts that verification upstream of every irreversible publish step.
    name: Binding Tests
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: iyulab/uncore/.github/workflows/bindings-reusable.yml@main
    with:
      package-name: undoc
      csharp-project-name: Undoc
      nuget-staging-mode: runtime-rid
      nuget-test-matrix: |
        [
          {"os":"ubuntu-latest","artifact":"native-linux-x64","runtime":"linux-x64"},
          {"os":"windows-latest","artifact":"native-win-x64","runtime":"win-x64"},
          {"os":"macos-latest","artifact":"native-osx-arm64","runtime":"osx-arm64"}
        ]
      validate-packed-nuget: false
      publish: false
    permissions:
      contents: read
    secrets: inherit

  create-release:
    name: Create Release
    needs: [check-version, build-release, binding-tests]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Only the CLI archives belong on the release. binding-tests runs in this
      # same workflow run and uploads native-*/python-*/nuget-package artifacts
      # of its own; an unfiltered download would attach those too.
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: undoc-*
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Release ${{ needs.check-version.outputs.version }}
          files: |
            artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.version, 'alpha') || contains(needs.check-version.outputs.version, 'beta') || contains(needs.check-version.outputs.version, 'rc') }}

      - name: Delete artifacts after release
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            undoc-*
            native-*
            python-wheel
            python-sdist
            nuget-package

  publish-crates:
    name: Publish to crates.io
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # These two steps used to carry `continue-on-error: true`, which made a
      # failed upload indistinguishable from a successful one: the release went
      # green while crates.io never received the crate, and the gap only showed
      # up when someone tried to depend on the version. Only the "already
      # uploaded" case is tolerated now (a re-run of a version that got through);
      # every other failure fails the job.
      - name: Publish library (undoc)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          if cargo publish 2>&1 | tee "$RUNNER_TEMP/publish-lib.log"; then
            exit 0
          fi
          if grep -qiE 'already (uploaded|exists)' "$RUNNER_TEMP/publish-lib.log"; then
            echo "::notice::undoc is already on crates.io at this version"
            exit 0
          fi
          exit 1

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish CLI (undoc-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          if cargo publish -p undoc-cli 2>&1 | tee "$RUNNER_TEMP/publish-cli.log"; then
            exit 0
          fi
          if grep -qiE 'already (uploaded|exists)' "$RUNNER_TEMP/publish-cli.log"; then
            echo "::notice::undoc-cli is already on crates.io at this version"
            exit 0
          fi
          exit 1

  publish-npm:
    name: Publish npm (@iyulab/undoc)
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url is required: it writes the .npmrc that maps
      # NODE_AUTH_TOKEN to registry auth. Without it `npm publish`
      # fails with ENEEDAUTH even when the token is set.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-wasm-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-release-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build undoc-wasm --target bundler --out-dir pkg

      - name: Set scoped npm package name
        run: |
          jq '.name = "@iyulab/undoc"' undoc-wasm/pkg/package.json > /tmp/pkg.json
          mv /tmp/pkg.json undoc-wasm/pkg/package.json

      - name: Copy LICENSE into pkg
        run: cp LICENSE undoc-wasm/pkg/

      - name: Publish to npm
        run: wasm-pack publish undoc-wasm/pkg --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cleanup-old-releases:
    name: Cleanup Old Releases
    # Run after the new release is published. We only need create-release
    # to have succeeded — cleanup is independent of crates.io publish.
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete releases and tags beyond the 10 most recent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Fetch up to 100 recent releases. Sort by creation time desc and
          # take everything AFTER index 10 — keep 10 newest, delete the rest.
          # --cleanup-tag removes the underlying git tag too, so the repo's
          # release list AND tag list stay bounded. Aligns with CLAUDE.md's
          # GitHub Actions 리소스 관리 정책 (reduce storage use).
          mapfile -t OLD < <(
            gh release list -R "$REPO" --limit 100 --json tagName,createdAt \
              | jq -r 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'
          )

          if [ ${#OLD[@]} -eq 0 ]; then
            echo "Nothing to clean up (<=10 releases exist)."
            exit 0
          fi

          echo "Deleting ${#OLD[@]} old release(s):"
          printf '  %s\n' "${OLD[@]}"

          for tag in "${OLD[@]}"; do
            # --cleanup-tag deletes the git tag alongside the release.
            # --yes skips the interactive confirmation.
            gh release delete "$tag" --yes --cleanup-tag -R "$REPO"
          done
