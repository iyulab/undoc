name: Release

# The pipeline itself is unparser-shared's release-reusable.yml, shared by the parser
# crates; this file keeps the trigger and says what differs here -- the PyPI and NuGet
# packages included, which that pipeline publishes after the GitHub Release.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: iyulab/unparser-shared/.github/workflows/release-reusable.yml@dc1e00162595b3e5b82f042563c29691298a3c12 # main
    with:
      package-name: undoc
      npm-readme: bindings/wasm/README.md
      csharp-project-name: Undoc
      nuget-staging-mode: runtime-rid
      nuget-test-matrix: |
        [
          {"os":"ubuntu-latest","artifact":"native-linux-x64","runtime":"linux-x64"},
          {"os":"windows-latest","artifact":"native-win-x64","runtime":"win-x64"},
          {"os":"macos-latest","artifact":"native-osx-arm64","runtime":"osx-arm64"}
        ]
      validate-packed-nuget: true
    # A called workflow can narrow the token's permissions, never widen them: this is the
    # most any of its jobs needs (creating the release and pruning old ones).
    permissions:
      contents: write
    secrets: inherit
