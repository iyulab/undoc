name: Deploy WASM Playground

on:
  push:
    branches: [main]
    paths:
      - 'undoc-wasm/**'
      - 'docs/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: iyulab/uncore/.github/workflows/pages-reusable.yml@main
    with:
      wasm-crate: undoc-wasm
    permissions:
      contents: read
      pages: write
      id-token: write
