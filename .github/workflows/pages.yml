name: Deploy WASM Playground

on:
  push:
    branches: [main]
    paths:
      - 'undoc-wasm/**'
      - 'docs/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: iyulab/unparser-shared/.github/workflows/pages-reusable.yml@dc1e00162595b3e5b82f042563c29691298a3c12 # main
    with:
      wasm-crate: undoc-wasm
    permissions:
      contents: read
      pages: write
      id-token: write
