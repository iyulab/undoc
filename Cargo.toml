[workspace]
members = [".", "cli", "undoc-wasm"]
resolver = "2"

[package]
name = "undoc"
version = "0.19.0"
edition = "2021"
authors = ["iyulab"]
description = "High-performance Microsoft Office document extraction to Markdown"
license = "MIT"
repository = "https://github.com/iyulab/undoc"
documentation = "https://docs.rs/undoc"
readme = "README.md"
keywords = ["docx", "xlsx", "pptx", "markdown", "office"]
categories = ["parsing", "text-processing"]
rust-version = "1.88"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["docx", "xlsx", "pptx", "doc", "xls", "ppt", "codepages", "refine"]
docx = []
xlsx = []
pptx = []
# Word 97-2003 binary documents (.doc), read through the CFB container `cfb` already opens.
doc = []
# Excel binary workbooks (.xls): Excel 97-2003 (BIFF8), Excel 5.0/95 and Excel 2.x-4.0.
xls = []
# PowerPoint 97-2003 binary presentations (.ppt).
ppt = []
# Decode 97-2003 document properties written in multi-byte and other single-byte Windows
# code pages (932, 949, 1251, ...). Without it those properties are left empty; UTF-16,
# UTF-8, Windows-1252 and plain ASCII are decoded either way.
codepages = ["dep:encoding_rs"]
async = ["tokio"]
# Slide rasterization (in progress): DrawingML geometry drawn from the ECMA-376 preset shape
# definitions. Off by default.
raster = ["pptx", "dep:tiny-skia", "dep:roxmltree", "dep:skrifa", "dep:zune-jpeg"]
# The C ABI includes slide rasterization (`undoc_render_section`), as unpdf's includes page
# rasterization: the bindings built on it are the consumer path for a rendered slide.
ffi = ["raster"]
# Shape-refinement pass (RenderOptions.refine). Enables unparser-shared's
# `refine` module, and with it a fresh pulldown-cmark + pulldown-cmark-to-cmark (undoc has no other use
# for a CommonMark parser) -- measured +21.5% wasm bundle size. On by default
# for native/CLI/FFI builds; undoc-wasm opts out via default-features=false.
refine = ["unparser-shared/refine"]

[dependencies]
# Slide rasterization (feature `raster`): the rasterizer with its PNG encoder/decoder, and a
# read-only XML tree for walking a slide's shapes with their layout, master and theme.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"], optional = true }
roxmltree = { version = "0.21", optional = true }
# Glyph outlines and metrics for slide text (feature `raster`).
skrifa = { version = "0.48", optional = true }
# JPEG pictures on slides (feature `raster`); PNG goes through tiny-skia.
zune-jpeg = { version = "0.5", optional = true }
# ZIP handling — default-features disabled: lzma/bzip2/xz/zstd require C toolchain
# OOXML files exclusively use Deflate; dropping other compression codecs is safe.
zip = { version = "9.0", default-features = false, features = ["deflate"] }

# OLE/CFB container inspection. Only used by format detection, to tell an ECMA-376
# encrypted OOXML package (a CFB holding `EncryptedPackage`) apart from a legacy binary
# Office file — both arrive with the same header. Pure Rust, so it builds for wasm32.
cfb = "0.15"

# XML parsing. `serialize` feature intentionally omitted — undoc uses only the
# manual Reader/Event API; serde derives live on undoc's own model types.
# Pinned at ^0.41 for RUSTSEC-2026-0194/-0195 (DoS) fixes; 0.40+ also emits
# entity refs as separate Event::GeneralRef events (see src/decode.rs).
quick-xml = "0.42"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Shared plumbing for the un* family: error-kind numbering and C-ABI helpers at
# the crate root (dependency-free), plus the shape-refinement pass behind the
# `refine` feature above.
unparser-shared = { version = "0.6", default-features = false }

# Text processing
unicode-normalization = "0.1"
unicode-width = "0.2"

# Metafile pictures in 97-2003 documents are DEFLATE-compressed. Already in the tree through
# `zip`'s deflate support, with the same backend.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# Optional: Windows code pages for 97-2003 document properties (feature `codepages`)
encoding_rs = { version = "0.8", optional = true }

# Optional: Async
tokio = { version = "1.42", features = ["rt", "fs"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.14"
# Tests parse the rendered Markdown back to check an image survives as one image.
pulldown-cmark = { version = "0.13", default-features = false }

[[bench]]
name = "parse_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
